# Render Blueprint: one free web service that serves the API, Socket.IO and the built SPA.
# See docs/despliegue.md for the full checklist (Neon database + Render service).
services:
  - type: web
    name: kanban
    runtime: node
    plan: free
    # NODE_ENV=production can make pnpm skip devDependencies (vite, tsc): --prod=false forces them.
    # Migrations and the demo seed run at build time with DATABASE_URL_OWNER.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm --filter @kanban/api db:migrate && pnpm --filter @kanban/api db:seed-if-empty
    # The API runs TypeScript through tsx (a dependency); there is no separate compiled output.
    startCommand: pnpm --filter @kanban/api start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      # Mailbox only. Switch to `brevo` once BREVO_API_KEY and MAIL_FROM are set
      # (docs/despliegue.md, section 5). Brevo is used through its HTTPS API: Render's free plan
      # blocks outbound SMTP.
      - key: MAIL_TRANSPORT
        value: none
      # One proxy (Render's) in front of the app: the client IP comes from X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Secrets: set in the Render dashboard (never committed). Neon connection strings.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_OWNER
        sync: false
      # https://<service>.onrender.com (known after the first creation of the service).
      - key: APP_ORIGIN
        sync: false
      # Random values generated by Render (the config requires >= 32 characters in production).
      - key: SESSION_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: DEMO_RESET_TOKEN
        generateValue: true
      # Brevo (dashboard: SMTP & API > API Keys): API key and the verified sender,
      # e.g. "Kanban demo <you@gmail.com>". Required when MAIL_TRANSPORT=brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
