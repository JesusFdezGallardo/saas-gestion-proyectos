name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database and app_user role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d kanban -v ON_ERROR_STOP=1 -f apps/api/db/init/00-databases.sql
          psql -h localhost -U postgres -d kanban -v ON_ERROR_STOP=1 -f apps/api/db/init/01-roles.sql
      - name: Migrate database
        run: pnpm --filter @kanban/api db:migrate
        env:
          DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/kanban
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          TEST_DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/kanban_test
          TEST_DATABASE_URL: postgres://app_user:app_user@localhost:5432/kanban_test
  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the app_user role
        # The kanban_e2e database is created (and recreated) by e2e/scripts/serve.mjs.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d kanban -v ON_ERROR_STOP=1 -f apps/api/db/init/00-databases.sql
          psql -h localhost -U postgres -d kanban -v ON_ERROR_STOP=1 -f apps/api/db/init/01-roles.sql
      - name: Install Chromium
        run: pnpm --filter @kanban/e2e exec playwright install --with-deps chromium
      - name: Build, start the app (DEMO_MODE, MAIL_TRANSPORT=none) and run Playwright
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
